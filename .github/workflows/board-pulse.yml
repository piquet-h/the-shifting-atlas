name: Board Pulse (Prove & Sense)

on:
  workflow_run:
    workflows:
      - Backend Functions Deploy
      - Frontend Static Web App Deploy
    types: [completed]
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Application Insights lookback offset (e.g. 24h, 3d)'
        required: false
        type: string
        default: '24h'
      apply:
        description: 'Apply issue closures / transitions on GitHub'
        required: false
        type: boolean
        default: true
      create_bugs:
        description: 'Auto-create deduplicated bug issues from App Insights exception clusters'
        required: false
        type: boolean
        default: false

concurrency:
  group: board-pulse
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  pulse:
    name: Prove state:testing & Sense Production Telemetry
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Optional Azure Login (OIDC for Application Insights)
        id: azure_login
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove state:testing issues & sense telemetry regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_INSIGHTS_APP: ${{ vars.APP_INSIGHTS_APP }}
          APP_INSIGHTS_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-atlas-game' }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_OFFSET: ${{ inputs.offset }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_CREATE_BUGS: ${{ inputs.create_bugs }}
        run: |
          set -euo pipefail
          offset="24h"
          if [[ "$INPUT_OFFSET" =~ ^[0-9]+[hd]$ ]]; then
            offset="$INPUT_OFFSET"
          fi

          prove_args=(prove --offset "$offset")
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_APPLY" = "true" ]; then
            prove_args+=(--apply)
          fi
          node scripts/board-pulse.mjs "${prove_args[@]}"

          sense_args=(sense --offset "$offset")
          if [ "$INPUT_APPLY" = "true" ] && [ "$INPUT_CREATE_BUGS" = "true" ]; then
            sense_args+=(--apply --create-bugs)
          fi
          node scripts/board-pulse.mjs "${sense_args[@]}"
