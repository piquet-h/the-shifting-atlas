name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve Candidate & Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lanes_json: ${{ steps.scope.outputs['lanes-json'] }}
      legs_json: ${{ steps.scope.outputs['legs-json'] }}
      bicep_json: ${{ steps.scope.outputs['bicep-json'] }}
      formatter_json: ${{ steps.scope.outputs['formatter-json'] }}
      has_legs: ${{ steps.scope.outputs['has-legs'] }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merge candidate
        id: candidate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.ref }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" "${head_sha}"
            base_sha="$(git rev-parse "origin/${base_ref}")"
            git checkout --detach "${head_sha}"
            git -c user.name="Shifting Atlas CI" -c user.email="ci@the-shifting-atlas.invalid" merge --no-edit "${base_sha}"
          else
            head_sha="$(git rev-parse HEAD)"
            if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              base_sha="${{ github.event.before }}"
            else
              base_sha="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
            fi
          fi
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Compute affected lanes & matrix legs
        id: scope
        env:
          PR_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          PR_HEAD_SHA: HEAD
        run: node scripts/pr-validation-scope.mjs

  validate:
    name: ${{ matrix.leg.label }}
    needs: scope
    if: needs.scope.outputs.has_legs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.scope.outputs.legs_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out merged candidate on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          git checkout --detach "${HEAD_SHA}"
          git -c user.name="Shifting Atlas CI" -c user.email="ci@the-shifting-atlas.invalid" merge --no-edit "${BASE_SHA}"

      - name: Setup Node & install workspaces
        uses: ./.github/actions/setup-node-install

      # --- Shared lane ---
      - name: Shared — Lint, Typecheck, Build, Prompts & Unit Tests
        if: matrix.leg.lane == 'shared'
        run: |
          npm run lint:shared
          npm run typecheck:shared
          npm run build:shared
          node scripts/validate-prompts.mjs
          npm run test:shared
          node --test scripts/test/package-backend-function.test.mjs scripts/test/pipeline-scope.test.mjs

      # --- Backend unit & static invariants lane ---
      - name: Backend (Unit) — Lint, Typecheck, Layer Guard & Unit Tests
        if: matrix.leg.lane == 'backend-unit'
        run: |
          npm run build:shared
          npm run lint:backend
          npm run typecheck:backend
          npm run build:backend

          echo "Validating unit test layer isolation..."
          EXCEPTIONS=(
            "backend/test/unit/persistenceConfigStrict.test.ts"
            "backend/test/unit/appInsightsSampling.test.ts"
            "backend/test/unit/gremlinConfig.binding.test.ts"
            "backend/test/unit/nullTelemetryClient.test.ts"
            "backend/test/unit/inversifyProductionConfig.memoryMode.test.ts"
          )
          EXCLUDE_PATTERN=""
          for file in "${EXCEPTIONS[@]}"; do
            EXCLUDE_PATTERN="$EXCLUDE_PATTERN --exclude=$(basename "$file")"
          done
          if grep -r "process.env.PERSISTENCE_MODE" backend/test/unit/ $EXCLUDE_PATTERN 2>/dev/null; then
            echo "::error::Unit tests must not manipulate PERSISTENCE_MODE directly"
            exit 1
          fi
          if grep -r "new InMemory.*Repository\|new Cosmos.*Repository" backend/test/unit/ 2>/dev/null; then
            echo "::error::Unit tests must not instantiate concrete repositories directly"
            exit 1
          fi
          if grep -r "setupTestContainer.*'cosmos'\|setupTestContainer.*'memory'" backend/test/unit/ --exclude=nullTelemetryClient.test.ts --exclude=mockRepositories.test.ts 2>/dev/null; then
            echo "::error::Unit tests must use UnitTestFixture only"
            exit 1
          fi

          npm run test:unit --workspace the-shifting-atlas-backend
          node --test scripts/test/verify-runtime-invariants.test.mjs

      # --- Backend integration, runtime behavior & standalone packager lane ---
      - name: Backend (Integration) — Integration Tests, Runtime Invariants & Function Packager
        if: matrix.leg.lane == 'backend-integration'
        run: |
          npm run build:shared
          npm run build:backend
          npm run verify:runtime-behavior
          npm run test:integration --workspace the-shifting-atlas-backend
          npm run package:backend

      # --- Frontend lane ---
      - name: Frontend — Lint, Typecheck, Build, Tests & Deployable Check
        if: matrix.leg.lane == 'frontend'
        run: |
          npm run build:shared
          npm run lint:frontend
          npm run typecheck:frontend
          npm run build:frontend
          npm run test:frontend
          node scripts/verify-deployable.mjs

      # --- Accessibility lane ---
      - name: Accessibility — Axe Scan
        if: matrix.leg.lane == 'a11y' && github.event_name == 'pull_request'
        run: |
          npm run build:shared
          npm run build:frontend
          npm run a11y --workspace the-shifting-atlas-frontend

      - name: Upload axe report
        if: always() && matrix.leg.lane == 'a11y' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: frontend/axe-report
          if-no-files-found: ignore

      # --- Infrastructure lane (zero Azure credentials required) ---
      - name: Infrastructure — Offline Bicep Compilation & Workbook Check
        if: matrix.leg.lane == 'infrastructure'
        env:
          BICEP_FILES_JSON: ${{ needs.scope.outputs.bicep_json }}
        run: node scripts/pr-validation-bicep.mjs

      # --- Governance lane (Prettier on changed TS/TSX, secret scan, docs, instructions, milestone scripts) ---
      - name: Governance — Changed-File Formatting, Secret Scan & Repo Invariants
        if: matrix.leg.lane == 'governance'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          set -euo pipefail

          # 1. Secret scan on commit range via gitleaks binary (license-free, offline)
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          if [ -n "${BASE_SHA}" ]; then
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${BASE_SHA}..HEAD"
          else
            "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .
          fi

          # 2. Prettier check on changed workspace TypeScript files
          if [ -n "${BASE_SHA}" ]; then
            mapfile -t changed_ts < <(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- 'shared/src/**/*.ts' 'shared/test/**/*.ts' 'backend/src/**/*.ts' 'backend/test/**/*.ts' 'frontend/src/**/*.ts' 'frontend/src/**/*.tsx' 'frontend/test/**/*.ts' 'frontend/test/**/*.tsx' || true)
            if [ "${#changed_ts[@]}" -gt 0 ]; then
              npx prettier --check "${changed_ts[@]}"
            fi
          fi

          # 3. Instruction freshness, milestone script tests & advisory docs/catalog reports
          node scripts/verify-instructions.mjs
          node --test scripts/reanalyze-milestone.test.mjs scripts/ensure-milestone-has-delivery-slices.test.mjs scripts/test/pipeline-scope.test.mjs scripts/test/package-backend-function.test.mjs
          npm run verify:docs-policy
          npm run catalog:check || true

  summary:
    name: PR validation
    needs: [scope, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required validation outcome
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          HAS_LEGS: ${{ needs.scope.outputs.has_legs }}
          LANES_JSON: ${{ needs.scope.outputs.lanes_json }}
        run: |
          set -euo pipefail
          {
            echo "## PR Validation Summary"
            echo ""
            echo "| Check | Result |"
            echo "| :--- | :--- |"
            echo "| Candidate Scope | \`${SCOPE_RESULT}\` |"
            echo "| Selected Lanes | \`${LANES_JSON:-[]}\` |"
            echo "| Parallel Validation Legs | \`${VALIDATE_RESULT}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${SCOPE_RESULT}" != "success" ]; then
            echo "::error::Candidate scope resolution failed (${SCOPE_RESULT})"
            exit 1
          fi
          if [ "${HAS_LEGS}" = "true" ] && [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "::error::One or more validation legs failed (${VALIDATE_RESULT})"
            exit 1
          fi
          echo "All required validation legs passed."

  automerge:
    name: Auto-merge (Copilot / automerge label)
    needs: [scope, summary]
    if: >-
      github.event_name == 'pull_request' &&
      needs.summary.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'copilot/') ||
       contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge validated same-repo PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          actual_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          state="$(jq -r '.state' <<< "$pr_json")"

          if [ "$state" != "open" ] || [ "$actual_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR state changed since validation started (state=${state}, head=${actual_sha}); skipping auto-merge."
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$EXPECTED_HEAD_SHA" --delete-branch || echo "Auto-merge deferred (review or branch policy pending)."
