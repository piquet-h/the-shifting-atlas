name: Frontend Static Web App Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-swa-deploy.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual redeploy reason'
        required: false

permissions:
  id-token: write
  contents: write
  issues: write

concurrency:
  group: swa-frontend-prod
  cancel-in-progress: false

jobs:
  build-and-deploy-prod:
    name: Build & Deploy (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & install workspaces
        uses: ./.github/actions/setup-node-install

      - name: Check deploy scope since deployed-frontend
        id: scope
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/pr-validation-scope.mjs --deploy-unit frontend

      - name: Build shared & frontend (Vite)
        if: steps.scope.outputs.affected == 'true'
        run: |
          npm run build:shared
          npm run build:frontend
          node scripts/verify-deployable.mjs

      - name: Resolve SWA Name
        id: swa_name
        if: steps.scope.outputs.affected == 'true'
        run: |
          if [ -n "${{ vars.SWA_NAME }}" ]; then echo "SWA_NAME=${{ vars.SWA_NAME }}" >> "$GITHUB_ENV"; fi
          if [ -z "${{ vars.SWA_NAME }}" ]; then
            echo "::warning title=Missing SWA_NAME::Repository variable SWA_NAME not set. Deployment may fail if name required."
          fi

      - name: Azure login (OIDC) for app settings
        if: steps.scope.outputs.affected == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure SWA AAD app settings (optional)
        if: steps.scope.outputs.affected == 'true'
        env:
          SWA_NAME: ${{ env.SWA_NAME }}
          AAD_CLIENT_ID: ${{ secrets.CUSTOMER_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AAD_TENANT_ID: ${{ secrets.CUSTOMER_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AAD_CLIENT_SECRET: ${{ secrets.CUSTOMER_SECRET || secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SWA_NAME:-}" ]; then
            echo "No SWA_NAME available; skipping app settings."; exit 0; fi
          kv_pairs=()
          [ -n "${AAD_CLIENT_ID}" ] && kv_pairs+=("AAD_CLIENT_ID=${AAD_CLIENT_ID}")
          [ -n "${AAD_TENANT_ID}" ] && kv_pairs+=("AAD_TENANT_ID=${AAD_TENANT_ID}")
          [ -n "${AAD_CLIENT_SECRET}" ] && kv_pairs+=("AAD_CLIENT_SECRET=${AAD_CLIENT_SECRET}")
          if [ ${#kv_pairs[@]} -eq 0 ]; then
            echo "No non-empty AAD settings to apply."; exit 0; fi
          echo "Applying ${#kv_pairs[@]} app settings to ${SWA_NAME}"
          az staticwebapp appsettings set --name "${SWA_NAME}" --setting-names "${kv_pairs[@]}"

      - name: Preflight - Validate deployment token (Production)
        if: steps.scope.outputs.affected == 'true'
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "::error title=Missing AZURE_STATIC_WEB_APPS_API_TOKEN::Secret not set."
            exit 1
          fi
          echo "Deployment token appears configured (redacted, length > 0)."

      - name: Preflight - Verify Static Web App exists & token matches
        if: steps.scope.outputs.affected == 'true' && env.SWA_NAME != ''
        env:
          SWA_NAME: ${{ env.SWA_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PROVIDED_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! az staticwebapp show --name "${SWA_NAME}" >/dev/null 2>&1; then
            echo "::error title=Static Web App not found::No Static Web App named ${SWA_NAME} found."
            exit 1
          fi
          portal_token=$(az staticwebapp secrets list --name "${SWA_NAME}" --query properties.apiKey -o tsv 2>/dev/null || true)
          if [ -n "${portal_token}" ] && [ "${portal_token}" != "${PROVIDED_TOKEN}" ]; then
            echo "::error title=Deployment token mismatch::Secret AZURE_STATIC_WEB_APPS_API_TOKEN does not match portal deployment token."
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps (Production)
        if: steps.scope.outputs.affected == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: 'upload'
          app_location: 'frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        env:
          SWA_NAME: ${{ env.SWA_NAME }}

      - name: Verify live SWA HTTP response
        if: steps.scope.outputs.affected == 'true' && env.SWA_NAME != ''
        run: |
          set -euo pipefail
          SWA_HOST=$(az staticwebapp show --name "${SWA_NAME}" --query "defaultHostname" -o tsv 2>/dev/null || true)
          if [ -n "$SWA_HOST" ]; then
            curl --silent --show-error --retry 6 --retry-delay 5 --max-time 10 -fsS "https://${SWA_HOST}" >/dev/null
            echo "✅ Static Web App reachable at https://${SWA_HOST}"
          fi

      - name: Record deployed-frontend tag & transition issues to state:testing
        if: steps.scope.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-handoff.mjs --unit frontend --base-sha "${{ steps.scope.outputs.base_sha }}"
