name: Backend Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-backend-function.mjs'
      - 'scripts/bundle-prompts.mjs'
      - '.github/workflows/backend-functions-deploy.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual redeploy reason'
        required: false

permissions:
  id-token: write
  contents: write
  issues: write

concurrency:
  group: backend-functions-prod
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: 'func-atlas'

jobs:
  build-and-deploy:
    name: Build & Deploy Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & install workspaces
        uses: ./.github/actions/setup-node-install

      - name: Check deploy scope since deployed-backend
        id: scope
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/pr-validation-scope.mjs --deploy-unit backend

      - name: Build shared & backend
        if: steps.scope.outputs.affected == 'true'
        run: |
          npm run build:shared
          npm run build:backend

      - name: Run backend tests
        if: steps.scope.outputs.affected == 'true'
        run: npm run test:backend

      - name: Package standalone Function archive
        if: steps.scope.outputs.affected == 'true'
        run: |
          npm run package:backend
          cd backend/.deploy
          zip -qr ../dist.zip ./*

      - name: Azure Login (OIDC)
        if: steps.scope.outputs.affected == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Function App Name
        id: resolve
        if: steps.scope.outputs.affected == 'true'
        run: |
          RESOURCE_GROUP="rg-atlas-game"
          FUNCTION_APPS=$(az functionapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'func-atlas')].name" -o tsv 2>/dev/null || true)

          if [ -n "$FUNCTION_APPS" ]; then
            FUNCTION_APP_NAME=$(echo "$FUNCTION_APPS" | head -1)
            echo "Found function app: $FUNCTION_APP_NAME"
            echo "FUNCTION_APP_NAME=$FUNCTION_APP_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Function app not found, using default: ${{ env.AZURE_FUNCTIONAPP_NAME }}"
            echo "FUNCTION_APP_NAME=${{ env.AZURE_FUNCTIONAPP_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure Functions (dist artifact)
        id: deploy
        if: steps.scope.outputs.affected == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.resolve.outputs.FUNCTION_APP_NAME }}
          package: 'backend/dist.zip'
          slot-name: 'Production'

      - name: Verify deployment (registered functions & cold-start health gate)
        if: steps.scope.outputs.affected == 'true'
        env:
          DEPLOY_APP_URL: ${{ steps.deploy.outputs['app-url'] }}
        run: |
          set -euo pipefail
          FUNCTION_APP_NAME="${{ steps.resolve.outputs.FUNCTION_APP_NAME }}"
          RAW_URL="${DEPLOY_APP_URL:-}"
          if [ -z "$RAW_URL" ]; then
            HOST_FROM_CLI=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "rg-atlas-game" --query "properties.defaultHostName || defaultHostName" -o tsv 2>/dev/null || true)
            RAW_URL="https://${HOST_FROM_CLI:-${FUNCTION_APP_NAME}.azurewebsites.net}"
          fi
          BASE_URL="${RAW_URL%/}"

          echo "Probing ${BASE_URL}/api/backend/health (with cold-start retry budget)..."
          status_code="000"
          for attempt in $(seq 1 12); do
            status_code="$(curl --silent --show-error --max-time 15 --write-out '%{http_code}' --output /tmp/health-probe.txt "${BASE_URL}/api/backend/health" || echo "000")"
            case "$status_code" in
              2*|401)
                echo "✅ Host reachable at ${BASE_URL} (HTTP ${status_code} on attempt ${attempt})"
                break
                ;;
              502|503|504|000)
                echo "Attempt ${attempt}/12 returned HTTP ${status_code} (warming up); retrying in 10s..."
                sleep 10
                ;;
              *)
                echo "::error title=Backend Health Failed::${BASE_URL}/api/backend/health returned HTTP ${status_code}"
                cat /tmp/health-probe.txt 2>/dev/null || true
                exit 1
                ;;
            esac
          done

          if [[ ! "$status_code" =~ ^(2..|401)$ ]]; then
            echo "::error title=Backend Warmup Timeout::${BASE_URL} remained unhealthy (last HTTP ${status_code})"
            exit 1
          fi

          # Confirm the Azure Functions host loaded dist/src/index.js and registered functions
          fn_count="$(az functionapp function list --name "$FUNCTION_APP_NAME" --resource-group "rg-atlas-game" --query "length(@)" -o tsv 2>/dev/null || echo "0")"
          echo "Registered Azure Functions count: ${fn_count}"
          if [ "${fn_count:-0}" -eq 0 ]; then
            echo "::error title=Zero Functions Registered::Azure Functions host registered 0 functions from backend/dist.zip"
            exit 1
          fi

      - name: Record deployed-backend tag & transition issues to state:testing
        if: steps.scope.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-handoff.mjs --unit backend --base-sha "${{ steps.scope.outputs.base_sha }}"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Backend Functions Deployment"
            if [ "${{ steps.scope.outputs.affected }}" != "true" ]; then
              echo "* Skipped: no runtime backend/shared changes since \`deployed-backend\`."
            else
              echo "* Function App: \`${{ steps.resolve.outputs.FUNCTION_APP_NAME }}\`"
              echo "* Base SHA: \`${{ steps.scope.outputs.base_sha }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
