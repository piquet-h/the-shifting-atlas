name: 'Setup Node and Install'
description: 'Sets up Node.js from .nvmrc and installs npm workspaces dependencies from root package-lock.json (zero registry auth required).'
inputs:
  working-directory:
    description: 'Directory in which to run npm ci (defaults to repository root)'
    required: false
    default: '.'
  node-version-file:
    description: 'Path to Node version file'
    required: false
    default: '.nvmrc'
  cache-dependency-path:
    description: 'Path to lockfile for caching'
    required: false
    default: 'package-lock.json'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Install workspace dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --no-audit --no-fund
